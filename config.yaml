# Bot configuration (used for result generation and SOP/tool loading)
bot:
  bot_id: "21f57781-fe97-4956-bcfc-183df5fbf5a1"
  bot_ref_id: "616e6fb1-58d4-40f4-b804-7e80a2dfa083"
  llm_name: "Model_21f57781-fe97-4956-bcfc-183df5fbf5a1_v1_May2020261558"
  env: "qa"
  # Source UUIDs for agent retrieval filtering
  filter_tags_source_uuids:
    - "85eb6b5d-9a5d-4229-9d59-24ad04fde061"
  

# Evaluation judge configuration
evaluation:
  model_name: "gpt-5.2"
  reasoning_effort: "low"
  batch_size: 8
  delay_seconds: 5

# Live config endpoints
config_service:
  local:
    dm_config_url: ""
    # gateway_url: "http://0.0.0.0:8200/v1/llm/get_ans_sync_stream"
    gateway_url: "http://ds-gateway-local.internal.netomi.com/v1/llm/get_ans_sync_stream"
    env: "local"
  qa:
    dm_config_url: "http://qa-configs.internal.netomi.com/v1/service/configuration/get"
    gateway_url: "http://ds-gateway-qa.internal.netomi.com/v1/llm/get_ans_sync_stream"
    env: "qa"
  dev:
    dm_config_url: "http://configmanager-dev1.internal.netomi.com/v1/service/configuration/get"
    gateway_url: "http://ds-gateway-dev.internal.netomi.com/v1/llm/get_ans_sync_stream"
    env: "dev1"
  prod:
    dm_config_url: ""
    gateway_url: ""
    env: "prod"
  service_name: "ds-gateway-app"
  region: "us-east-1"
  timeout_seconds: 10
  # LLM prediction service settings (shared across envs)
  api:
    local_url: "http://0.0.0.0:8200/v1/llm/get_ans_sync_stream"
    headers:
      serviceEndpointType: "ecs-cpu-lt"
      Content-Type: "application/json"
    request_timeout: 1000
    sleep_timer: 5

# DMProxy fallback default values
dm_proxy_defaults:
  qa:
    redis_host: "ds-redis-qa.internal.netomi.com"
    datamanager_url: "http://dm-qa-a.internal.netomi.com/"
  dev:
    redis_host: "ds-redis-dev1.internal.netomi.com"
    datamanager_url: "http://dm-dev1.internal.netomi.com"
  redis_port: 6379
  redis_password: ""
  client_secret_key: "PWUWERREWT"
  cache_ttl: 300
  api_timeout: 5
  total_retries: 3
  max_concurrency: 3
  in_memory_cache_size: 5000
  in_memory_cache_ttl: 3600
  use_in_memory_cache: false
  max_in_memory_cache_entry_size: 102400

# DMProxy parameters
dm_proxy_api:
  bot_env: "SANDBOX"
  capability_id: 2
  is_action_v2_enabled: true

# Evaluation template prompt file
prompts:
  eval_prompt_path: "prompts/eval_prompt.txt"

# ---------------------------------------------------------------------------
# CLI / script defaults  (all overridable via command-line flags)
# ---------------------------------------------------------------------------
defaults:
  model_name: "gpt-5.2-121-latest-final"
  dataset_path: "datasets/llm_eval_dataset_1.pkl"
  output_dir: "results"
  skip_generation: false
  skip_evaluation: false
  results_file: null
